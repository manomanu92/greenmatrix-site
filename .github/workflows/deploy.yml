name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node >= 22.22.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Google Apps Script web app URL — writes the enquiry to the Sheet
          # and emails a notification. See google-apps-script/README.md.
          # Add it under Settings → Secrets and variables → Actions → Variables.
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_FORM_TOKEN: ${{ vars.PUBLIC_FORM_TOKEN }}
          # Only needed for a PROJECT page (user.github.io/repo-name).
          # Leave unset for a custom domain or a user/org page.
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
